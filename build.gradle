plugins {
    id 'java-library'
    id 'eclipse'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.171'
    id 'com.matthewprenger.cursegradle' version '1.4.0'
}

sourceSets {
    main {
        java {
            srcDirs("linkableapi/src/")
        }
    }
}

def key = System.getenv("CURSETOKEN")
if(key == null)
	key = 'dev'
curseforge {
  apiKey = key
  project {
    id = '503143'
    changelog = file('changelog.md')
    changelogType = 'markdown'
    releaseType = 'release'
    addGameVersion 'Java 21'
  }
}


def ver = System.getenv("APPVEYOR_BUILD_VERSION")
if(ver == null)
	ver = "0.0"
version = ver
group = 'com.troblecodings'
base.archivesName = 'TC-Redstone-1.21.5'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        // configured as client
    }

    server {
        arguments '--nogui'
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"
}

jar {
    manifest {
        attributes([
            "Specification-Title": "TC-Redstone",
            "Specification-Vendor": "troblecodings",
            "Specification-Version": ver,
            "Implementation-Title": project.name,
            "Implementation-Version": ver,
            "Implementation-Vendor" :"troblecodings",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}
