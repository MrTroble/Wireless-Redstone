plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '7.1.+'
    id 'net.darkhax.curseforgegradle' version '1.3.+'
    id 'com.modrinth.minotaur' version '2.+'
}

group = project.mod_group
version = project.mod_version

base {
    archivesName = "${project.mod_name}-${project.minecraft_version}-${project.loader}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.java_version.toInteger())
}

sourceSets {
    main {
        java {
            srcDirs("linkableapi/src/")
        }
    }
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', 'tcredstone'
    }
    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', 'tcredstone'
        programArgument '--nogui'
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${project.neoforge_version}"
}

jar {
    manifest {
        attributes([
            "Specification-Title": project.mod_name,
            "Specification-Vendor": "troblecodings",
            "Specification-Version": project.version,
            "Implementation-Title": project.mod_name,
            "Implementation-Version": project.version,
            "Implementation-Vendor": "troblecodings",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    from("changelog.md")
    from("LICENSE")
}

tasks.register("publishCurseforge", net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    def key = System.getenv("CURSETOKEN")
    if (key == null)
        key = 'dev'
    apiToken = key
    def mainFile = upload(project.curseforge_project_id, jar)
    mainFile.changelog = file("changelog.md").text
    mainFile.changelogType = 'markdown'
    mainFile.releaseType = 'release'
    mainFile.addModLoader("${project.loader}")
    mainFile.addEnvironment("Client", "Server")
    mainFile.addGameVersion("${project.minecraft_version}")
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")

    projectId = project.modrinth_project_id

    versionNumber = project.version
    versionName = "${project.mod_name} ${project.version}"

    uploadFile = jar

    gameVersions = [project.minecraft_version]
    loaders = [project.loader.toLowerCase()]

    changelog = file("changelog.md").text
}

tasks.register("publishModrinth") {
    dependsOn("modrinth")
}
